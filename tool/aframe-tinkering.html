<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAW Tablet</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    .title {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: cyan;
      font-size: 24px;
      z-index: 10;
      letter-spacing: 4px;
    }
  </style>
</head>

<body>

<div class="title">LAW TABLET</div>

<a-scene background="color: #050816">


  <a-entity position="0 1.6 4">
    <a-camera></a-camera>
  </a-entity>


  <a-light type="ambient" color="#777"></a-light>

  <a-light
    type="point"
    intensity="2"
    color="#00ffff"
    position="2 4 4">
  </a-light>

  <a-light
    type="point"
    intensity="1.5"
    color="#aa00ff"
    position="-2 2 1">
  </a-light>

  <!-- Floor -->
  <a-plane
    rotation="-90 0 0"
    width="20"
    height="20"
    color="#111">
  </a-plane>


  <a-entity
    position="0 1 -2"
    animation="property: rotation;
               to: 0 360 0;
               loop: true;
               dur: 12000;
               easing: linear">

    <!-- Back Frame -->
    <a-box
      width="2.6"
      height="1.7"
      depth="0.08"
      color="#111827"
      metalness="1"
      roughness="0.2">
    </a-box>

    <!-- Screen -->
    <a-plane
      position="0 0 0.045"
      width="2.4"
      height="1.5"
      color="#0ea5e9"
      emissive="#0ea5e9"
      emissiveIntensity="0.35">
    </a-plane>


    <a-ring position="0 0 0.05"radius-inner="1.17"radius-outer="1.22" color="#00ffff">
    </a-ring>


    <a-circle
      position="0 0.72 0.05"
      radius="0.025"
      color="#000">
    </a-circle>


    <a-text
      value="LAW" position="0 0 0.06" align="center color="#ffffff" width="4"  shader="msdf">
    </a-text>

  </a-entity>

</a-scene>

</body>
</html>
